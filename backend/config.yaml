# Book brief + system configuration.
# Everything an agent needs to know about the job lives here, not in code.

brief:
  title: "Pay Me on UPI: How Digital Payments Changed Small Business in India"
  audience: "First-time small-business owners in India"
  chapters: 3
  words_min: 600
  words_max: 900
  tone: >-
    Friendly, clear and encouraging, as if a mentor is explaining things to a new
    shop owner. Plain English with no jargon; explain any technical term the first
    time it appears. The same tone and voice across all three chapters.
  citation_rules: >-
    Every fact, figure and date must have a numbered citation in the text, e.g. [1].
    Each chapter ends with a reference list giving the source name, title and a
    working link. Sources must be real and publicly accessible. Prefer official
    sources (NPCI, RBI, government websites) and reputable news outlets.

# Models and their list prices (USD per 1M tokens, verified October 2026).
# Every model the system may call needs an entry: pricing an unknown model ID
# raises instead of silently reporting $0. Cache writes are the 5-minute rate.
models:
  claude-opus-5-5:   { input: 4.00,  output: 20.00, cache_read: 0.20, cache_write: 5.00 }
  claude-sonnet-5-5: { input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50 }
  claude-haiku-4-5:  { input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25 }
  claude-fable-5-1:  { input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50 }  # dev sessions only

# Model tiers. Roles pick a tier; swap model IDs here without touching code.
tiers:
  strong: claude-opus-5-5      # hard judgement: planning, writing, fact verdicts
  balanced: claude-sonnet-5-5  # tool-heavy agent loops, editing
  fast: claude-haiku-4-5       # narrow classification

# Routing profiles: which tier and effort each agent runs at.
# `showcase` is the system as designed and produces the submitted book.
# `dev` runs the same graph, prompts and checks on cheaper settings, to find
# plumbing bugs (loops, routers, prompts) at a fraction of the price.
# `revision_effort` applies when a reviewer has sent the chapter back.
profile: showcase
profiles:
  showcase:
    planner:      { tier: strong,   effort: high }
    researcher:   { tier: balanced, effort: medium }
    writer:       { tier: strong,   effort: medium, revision_effort: high }
    editor:       { tier: balanced, effort: medium }
    claim_tagger: { tier: fast }
    fact_checker: { tier: strong,   effort: high }
    chief_editor: { tier: strong,   effort: high }
  dev:
    planner:      { tier: balanced, effort: medium }
    researcher:   { tier: balanced, effort: low }
    writer:       { tier: balanced, effort: low, revision_effort: medium }
    editor:       { tier: balanced, effort: low }
    claim_tagger: { tier: fast }
    fact_checker: { tier: balanced, effort: medium }
    chief_editor: { tier: balanced, effort: medium }

# Revision budgets: how many times each reviewer may send a chapter back.
limits:
  lint_rounds: 3
  editor_rounds: 2
  fact_check_rounds: 2
  max_writer_passes: 7
  research_tool_calls: 40       # per chapter, initial research
  gap_research_tool_calls: 15   # per fact-check driven gap fill
  max_evidence_per_chapter: 14

# Run controls.
run:
  parallel_chapters: 3   # chapters researched and written at once; set 1 if rate limits bite
  max_cost_usd: 5.0      # the run stops at this spend

# Source preferences given to the Researcher and the search tool.
sources:
  official_domains:
    - npci.org.in
    - rbi.org.in
    - pib.gov.in
    - meity.gov.in
    - finmin.nic.in
    - financialservices.gov.in
    - digitalindia.gov.in
    - india.gov.in
    - msme.gov.in
    - udyamregistration.gov.in
    - gst.gov.in
    - mygov.in
  reputable_news_domains:
    - thehindu.com
    - indianexpress.com
    - livemint.com
    - economictimes.indiatimes.com
    - business-standard.com
    - hindustantimes.com
    - reuters.com
    - bbc.com
    - moneycontrol.com
    - thehindubusinessline.com
    - financialexpress.com
  blocked_domains:
    - wikipedia.org
    - quora.com
    - reddit.com
    - medium.com
    - youtube.com
    - facebook.com
    - instagram.com
    - x.com
    - twitter.com
    - linkedin.com

human_in_the_loop: false
