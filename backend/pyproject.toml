[project]
name = "bookwriter"
version = "0.1.0"
description = "Multi-agent book writer: Planner, Researcher, Writer, Editor, Fact-checker and Chief Editor agents that write a cited three-chapter book"
readme = "README.md"
authors = [
    { name = "Shikhar-14", email = "sumanshikhar14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic[mcp]>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown>=3.11",
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tavily-python>=0.8.4",
    "trafilatura>=2.3.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
bookwriter = "bookwriter.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default values; these calls are evaluated once, by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
